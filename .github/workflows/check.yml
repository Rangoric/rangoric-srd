name: Check notes

# Frontmatter loads as strict YAML and as the website reads it, links into the SRD have a target, and notes meet
# the written note rules (the README's "Note rules" and each folder's Note Rules note; see check_notes.py).
# On a pull request, link problems fail only in the notes it changes (the rest show as warnings), and the notes it
# changes must be formatted by Prettier (.prettierrc).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Notes this change touches
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/changed.txt"
          else
            git diff --name-only "${{ github.event.before }}" HEAD > "$RUNNER_TEMP/changed.txt" 2>/dev/null || : > "$RUNNER_TEMP/changed.txt"
          fi
          cat "$RUNNER_TEMP/changed.txt"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/added.txt"
          else
            : > "$RUNNER_TEMP/added.txt"
          fi
      - run: python3 .github/scripts/check_notes.py . --changed "$RUNNER_TEMP/changed.txt" --added "$RUNNER_TEMP/added.txt"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Frontmatter as the website reads it
        if: ${{ !cancelled() }}
        # the versions in rangoric-srd-website's package-lock.json; keep them matching
        run: |
          npm install --prefix "$RUNNER_TEMP/fm" --no-save --no-package-lock --silent gray-matter@4.0.3 js-yaml@4.3.2
          NODE_PATH="$RUNNER_TEMP/fm/node_modules" node .github/scripts/check_frontmatter.cjs .
      - name: Formatting of the notes this change touches (Prettier; the version in the workshop's batch.py)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          git diff -z --name-only --diff-filter=d "origin/${{ github.base_ref }}...HEAD" -- '*.md' \
            | xargs -0 -r npx --yes prettier@3.8.1 --check
